[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "socialmcp"
version = "0.2.0"
description = "Local-first, ToS-compliant personal CRM for your social graph, delivered as an MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["mcp", "crm", "linkedin", "sqlite", "local-first", "networking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]

# Runtime deps are deliberately tiny: the MCP SDK, a file watcher, and the
# vector extension. Everything else is stdlib (sqlite3, csv, zipfile, urllib).
dependencies = [
    "mcp>=1.2,<3",   # 1.x FastMCP and 2.x MCPServer are both supported
    "watchdog>=4.0.0",
    "sqlite-vec>=0.1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
# Only needed to build the macOS app bundle; not a runtime dependency.
#
# dmgbuild lays out the disk-image window (background, icon positions, window
# size) by writing the .DS_Store directly. The usual alternative is to mount
# the image and drive Finder over AppleScript, which needs Automation
# permission and so interrupts a release build with a consent prompt — the
# exact class of surprise this app exists to avoid.
package = [
    "pyinstaller>=6.6",
    "dmgbuild>=1.6",
]

[project.scripts]
socialmcp = "socialmcp.cli:main"
socialmcp-server = "socialmcp.mcp_server.server:main"

[project.urls]
Homepage = "https://github.com/SciTechDude/socialMCP"
Issues = "https://github.com/SciTechDude/socialMCP/issues"

[tool.hatch.build.targets.wheel]
packages = ["socialmcp"]

[tool.hatch.build]
# schema.sql ships inside the wheel; db.py reads it at runtime.
include = ["socialmcp/**/*.py", "socialmcp/**/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:socialmcp.*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "PTH", "ARG", "DTZ"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # FastMCP decorators read defaults in signatures
    "RUF012",  # ClassVar annotations on adapter metadata are noise here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "SIM117", "S101"]
"socialmcp/adapters/linkedin/adapter.py" = ["SLF001"]
